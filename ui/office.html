<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office files</title>
<link rel="stylesheet" href="../__picode/tokens.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div id="hub" class="hub-shell" hidden>
  <header class="hub-head">
    <div class="hub-title-wrap">
      <svg class="hub-brand-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" stroke="#4f7df3"/>
        <path d="M3 9.5h18M9.5 9.5V20M15.5 9.5V20" stroke="#4f7df3"/>
        <rect x="11.5" y="12.5" width="2" height="2" rx=".4" fill="#2fa36b" stroke="none"/>
        <rect x="5" y="12.5" width="2" height="2" rx=".4" fill="#2fa36b" stroke="none"/>
      </svg>
      <h1 id="hub-title">Office files</h1>
    </div>
    <select id="hub-lang" class="pc-select" aria-label="Language">
      <option value="pt-BR">Português</option>
      <option value="en-US">English</option>
    </select>
  </header>

  <div class="hub-actions">
    <button type="button" id="btn-new-sheet" class="pc-button primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
      <span data-label>New spreadsheet</span>
    </button>
    <button type="button" id="btn-new-doc" class="pc-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span data-label>New document</span>
    </button>
    <button type="button" id="btn-new-deck" class="pc-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
      <span data-label>New presentation</span>
    </button>
    <button type="button" id="btn-open-file" class="pc-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span data-label>Open file</span>
    </button>
    <input id="file-picker" type="file" accept=".xlsx,.docx,.pptx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
  </div>

  <div id="hub-alert" class="hub-alert" role="alert" hidden>
    <span id="hub-alert-text"></span>
    <button type="button" id="hub-alert-close" class="pc-button">×</button>
  </div>

  <section id="hub-empty" class="hub-empty" hidden>
    <h2 id="hub-empty-title">No files saved here yet</h2>
    <p id="hub-empty-body">Create a blank spreadsheet, document, or presentation above, open a file from your computer, or import in Artifacts to work with agents.</p>
    <a id="hub-empty-action" class="pc-button" href="/#/artifacts">Open Artifacts</a>
  </section>

  <section id="hub-saved-wrap" hidden>
    <h2 id="hub-saved-heading" class="hub-section-title">Saved files</h2>
    <div id="hub-saved-list" class="hub-list"></div>
  </section>
</div>
<script src="hub.js"></script>
</body>
</html>
