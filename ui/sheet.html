<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreadsheet</title>
<link rel="stylesheet" href="office.css">
<style>
  html, body { margin: 0; height: 100%; color-scheme: light; background: #fff; font: 13px/1.45 system-ui, sans-serif; color: #1b1d23; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 12px; border-bottom: 1px solid #e9ecf2; background: #fff; }
  /* One row of chrome: the title and the save state ride the menu strip's
     right side, over it, so Univer's re-renders never take them away
     (owner, 2026-11-06). */
  #app { position: relative; }
  #bar { position: absolute; top: 0; right: 10px; height: 29px; min-height: 0; padding: 0; border: 0; background: transparent; z-index: 20; }
  #bar[hidden] { display: none; }
  #bar .name { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar .sp { flex: 1; }
  #bar select { height: 22px; padding: 0 4px; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff; color: #1b1d23; font: 12px system-ui, sans-serif; }
  /* A phone's app header already names the artifact; the bar keeps the
     language and the save state and leaves the menu strip alone. */
  @media (max-width: 560px) {
    #bar .name, #bar .sp { display: none; }
  }
  .save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #667085; white-space: nowrap; }
  .save .dot { width: 6px; height: 6px; border-radius: 50%; background: #98a2b3; }
  .save[data-tone="ok"] .dot { background: #1f8a5b; }
  .save[data-tone="busy"] .dot { background: #a15c07; }
  .save[data-tone="error"] { color: #b42318; }
  .save[data-tone="error"] .dot { background: #b42318; }
  #app { flex: 1; min-height: 0; }
  /* Univer centers its menu tabs and toolbar; the sheet's chrome starts at
     the left, aligned with the grid (owner, 2026-11-05). */
  #app header > div:first-child > div,
  #app header > div:nth-child(2),
  #app header > div:nth-child(2) > div { justify-content: flex-start !important; }
  #conflict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid #e9ecf2; background: #f6f7f9; font-size: 12.5px; }
  #conflict[hidden] { display: none; }
  #conflict .grow { flex: 1 1 220px; min-width: 0; margin: 0; }
  #conflict button { height: 28px; padding: 0 10px; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff; color: #1b1d23; font: inherit; cursor: pointer; }
  #conflict button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 24px; max-width: 520px; background: #fff; }
  #state[hidden] { display: none; }
  #state h1 { margin: 0; font-size: 15px; font-weight: 650; }
  #state p { margin: 0; color: #667085; }
  #state button { height: 32px; padding: 0 12px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #1b1d23; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="bar" hidden>
  <span class="name">Planilha</span>
  <span class="sp"></span>
  <select id="lang" aria-label="Idioma" title="Idioma" hidden>
    <option value="pt-BR">Português</option>
    <option value="en-US">English</option>
  </select>
  <span class="save" id="save" data-tone=""><span class="dot"></span><span id="save-text">Salvo</span></span>
</div>
<div id="app"></div>
<div id="conflict" hidden role="status">
  <p class="grow" id="conflict-text"></p>
  <button type="button" data-act="open">Abrir a nova versão</button>
  <button type="button" class="primary" data-act="keep">Manter a minha</button>
</div>
<div id="state" hidden>
  <h1 id="state-title">The workbook could not be opened</h1>
  <p id="state-text">Its file is still in the artifact's versions.</p>
  <button type="button" id="retry">Retry</button>
</div>
<script src="office.js"></script>
</body>
</html>
