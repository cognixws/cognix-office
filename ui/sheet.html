<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreadsheet</title>
<link rel="stylesheet" href="office.css">
<style>
  html, body { margin: 0; height: 100%; color-scheme: light; background: #fff; }
  #app { height: 100%; }
  /* v2 read: the grid and the sheet tabs, nothing else. The editor chrome
     arrives with the write doors, where it can act (preset options). */
  #state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 24px; max-width: 520px; font: 13px/1.5 system-ui, sans-serif; color: #1b1d23; background: #fff; }
  #state[hidden] { display: none; }
  #state h1 { margin: 0; font-size: 15px; font-weight: 650; }
  #state p { margin: 0; color: #667085; }
  #state button { height: 32px; padding: 0 12px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #1b1d23; font: inherit; cursor: pointer; }
  #state button:hover { border-color: #98a2b3; }
</style>
</head>
<body>
<div id="app"></div>
<div id="state" hidden>
  <h1>This workbook could not be drawn</h1>
  <p id="state-text">Its file is still in the artifact's versions.</p>
  <button type="button" id="retry">Retry</button>
</div>
<script src="office.js"></script>
</body>
</html>
